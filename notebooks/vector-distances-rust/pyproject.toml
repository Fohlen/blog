[project]
name = "vector-distances-rust"
version = "0.1.0"
description = "An empirical look at the distribution of cosine similarity in GloVe and fastText word embeddings"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab~=4.1.0",
    "matplotlib~=3.8.3",
    "more-itertools~=10.2.0",
    "numpy~=1.26.4",
]

[project.optional-dependencies]
scripts = [
    "fasttext-wheel~=0.9.2",
    "scipy~=1.13.0",
    "tqdm~=4.66.2",
]
