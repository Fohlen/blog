[project]
name = "linear-regression-l2-norm-dropout-relation"
version = "0.1.0"
description = "An empirical look at the equivalence of L2 regularisation and marginalised dropout in linear regression"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.10",
    "numpy>=2.2.4",
    "matrepr>=1.0",
    "seaborn>=0.13.2",
    "scipy>=1.16",
    "scikit-learn>=1.7",
    "torch>=2.10",
    "tabulate>=0.9",
]
