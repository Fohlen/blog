[project]
name = "triton-grpc"
version = "0.1.0"
description = "Benchmarking gRPC against HTTP on the Triton Inference Server"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.3,<5",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
scripts = [
    "tritonclient[http,grpc]>=2.39",
    "molotov>=2.6",
    "tqdm>=4.66",
]
