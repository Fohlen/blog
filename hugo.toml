baseURL = "https://fohlen.dev"
languageCode = "en-us"
title = "Lennard Berger's blog"
theme = "yinyang"
DefaultContentLanguage = "en"

[services]
  [services.googleAnalytics]
    id = ""

[markup.goldmark.renderer]
unsafe = true

[params]
description = "A Cognitive Scientist's blog"
disqus = ""
headTitle = "Lennard Berger's blog"
mainSections = ["posts"]
postHeaderContent = ""
lazyImage = true
extraCSSFiles = ["css/custom.css"]
extraHead = '''
<link rel="stylesheet" href="/katex/katex.min.css">
<script defer src="/katex/katex.min.js"></script>
<script defer src="/katex/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>'''

[params.author]
homepage = "https://github.com/Fohlen"
name = "Lennard Berger"

[[params.socials]]
name = "RSS"
link = "/index.xml"

[[params.socials]]
name = "About"
link = "/about/"

[[params.socials]]
name = "GitHub"
link = "https://github.com/Fohlen"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "node_modules/katex/dist"
    target = "static/katex"
    files = ["katex.min.css", "katex.min.js", "contrib/auto-render.min.js", "fonts/**"]